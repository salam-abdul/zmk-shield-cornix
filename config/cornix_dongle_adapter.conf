# Overrides zmk-keyboard-cornix's cornix_dongle_adapter.conf, which forces
# CONFIG_ZMK_DISPLAY=y. That requires a display shield (dongle_screen /
# dongle_display) to supply the zephyr,display chosen node; without one the
# build fails on an undeclared display device ordinal.
#
# No Zephyr 4.1-compatible shield exists for the xiao_ble color ST7789 yet, so
# we build the dongle without the status display. Remove this once a compatible
# display shield is available and added back to build.yaml.
CONFIG_ZMK_DISPLAY=n
