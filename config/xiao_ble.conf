# Restore ZMK PR #2749's xiao_ble board config, which the new xiao_ble//zmk
# hwmv2 board variant regressed.
#
# The current board ships a console-bound USB CDC-ACM (CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y,
# CONSOLE/SERIAL/UART_CONSOLE/EARLY_CONSOLE=y) and force-enables HW stack protection.
# ZMK only enables USB late in boot (SYS_INIT APPLICATION prio 96), but early-boot
# printk goes through the CDC-ACM against a not-yet-enabled USB stack, faulting/hanging
# before USB comes up -> the dongle runs but never enumerates as USB (no HID, no serial),
# screen dark. Every previously-working XIAO config (incl. the old seeeduino_xiao_ble
# board and ZMK PR #2749's xiao_ble board) disabled the console and stack guard.
#
# Applies to all xiao_ble//zmk builds in this repo (dongle, dongle-screen, resets).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_HW_STACK_PROTECTION=n
