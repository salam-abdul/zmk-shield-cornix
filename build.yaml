include:
  # dongle-screen disabled: zmk-dongle-screen uses LV_DISP_DEF_REFR_PERIOD which
  # was removed in LVGL 9 (Zephyr 4.1) and causes Kconfig errors on all builds.
  # zmk-dongle-display (englmaxi) is Zephyr 4.1 compatible but targets monochrome
  # I2C OLEDs, not the xiao_ble's color ST7789 SPI display.
  # Re-enable dongle display once a Zephyr 4.1-compatible color TFT shield exists.
  # - board: xiao_ble//zmk
  #   shield: cornix_dongle_adapter dongle_screen
  #   artifact-name: dongle-screen

  - board: xiao_ble//zmk
    shield: cornix_dongle_adapter
    artifact-name: dongle

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: dongle-reset

  - board: cornix_ph_left//zmk
    artifact-name: cornix_left_for_dongle

  - board: cornix_right//zmk
    artifact-name: cornix_right

  - board: cornix_right//zmk
    shield: settings_reset
    artifact-name: reset
